# Builds the two images and pushes them to GitHub Container Registry, so a computer runs Lorca
# from a published image instead of building the workspace itself.
#
#   ghcr.io/<owner>/lorca-relay:<version>   the relay
#   ghcr.io/<owner>/lorca-cli:<version>     a CLI Runner
#
# Each platform builds on a runner of its own architecture: a Rust workspace this size under
# QEMU takes an hour or more, where a native build takes minutes. The digests are then merged
# into one multi-architecture tag.
#
# A pull request builds both without pushing, so the Dockerfiles are checked before they merge.
# A push to main pushes `edge`; a `cli-vX.Y.Z` tag or a run by hand pushes the crate's version.
name: Images

on:
  push:
    branches: [main]
    tags: ["cli-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.crate.outputs.version }}
      tag: ${{ steps.mode.outputs.tag }}
      push: ${{ steps.mode.outputs.push }}
    steps:
      - uses: actions/checkout@v7
      - id: crate
        name: Read the crate's version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lorca") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # A pull request checks that the Dockerfiles build; it has no business pushing.
      - id: mode
        name: Decide what this run is
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ $EVENT == pull_request ]]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
            if [[ $REF_TYPE == tag || $EVENT == workflow_dispatch ]]; then
              echo "tag=${{ steps.crate.outputs.version }}" >> "$GITHUB_OUTPUT"
            else
              echo "tag=edge" >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    name: ${{ matrix.image.name }} (${{ matrix.platform }})
    needs: version
    # The arm64 runner is free for public repositories; a private one falls back to emulation.
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: relay, dockerfile: crates/relay/Dockerfile }
          - { name: cli, dockerfile: crates/cli/Dockerfile }
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to the registry
        if: needs.version.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One platform, one digest: the merge job puts them under the same tag. The action still
      # wants a tag beside `push-by-digest`, which only names the build here.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: ${{ needs.version.outputs.push == 'true' }}
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/lorca-${{ matrix.image.name }}:${{ needs.version.outputs.tag || 'pr' }}-${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}
          outputs: ${{ needs.version.outputs.push == 'true' && 'type=image,push-by-digest=true,name-canonical=true' || '' }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=GPL-3.0-only
      - name: Keep the digest
        if: needs.version.outputs.push == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        if: needs.version.outputs.push == 'true'
        with:
          name: digest-${{ matrix.image.name }}-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: ${{ matrix.image }} manifest
    needs: [version, build]
    if: needs.version.outputs.push == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [relay, cli]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The version tag, and `latest` only for a tagged release.
      - name: Merge the platforms under one tag
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/lorca-${{ matrix.image }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          tags=("$IMAGE:$TAG")
          if [[ $TAG != edge ]]; then tags+=("$IMAGE:latest"); fi
          args=()
          for tag in "${tags[@]}"; do args+=("--tag" "$tag"); done
          docker buildx imagetools create "${args[@]}" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$TAG"
