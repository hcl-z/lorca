# Releases the phone app (mobile/). `bun run release` starts it on main, and a run by hand does the
# same on the commit it runs on, for both platforms or one: it drafts the release mobile-vX.Y.Z of
# this repository, after the version in mobile/app.config.ts, with the version's section of
# CHANGELOG.md as its notes, then builds the Android APK, signed with the release keystore, and an
# unsigned iPhone .ipa, which a sideloading tool signs with the user's own Apple ID, and uploads
# both to the draft. When both builds finish, the workflow publishes the draft without making it
# the latest release, which stays the CLI's; publishing it makes it the update Android apps
# install. Running on main keeps the Rust, Gradle, and Xcode caches where the next release reads
# them. The iPhone build runs `bun run release-ios`, the Android one `bun run release-android`.
# docs/releasing-mobile.md has the steps.
name: Release phone app

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: What to release
        type: choice
        options: [iOS and Android, iOS, Android]
        default: iOS and Android

permissions:
  contents: read

# One run at a time, so two runs never upload to the same release.
concurrency:
  group: release-mobile

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.app.outputs.version }}
      tag: ${{ steps.app.outputs.tag }}
      ios: ${{ steps.app.outputs.ios }}
      android: ${{ steps.app.outputs.android }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - id: app
        name: Name the release after mobile/app.config.ts
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          version=$(bun -e 'console.log((await import("./mobile/app.config.ts")).default().version)')
          tag=mobile-v$version
          ios=true
          android=true
          case $PLATFORMS in
            iOS) android=false ;;
            Android) ios=false ;;
          esac
          # A release takes the tag that exists, so the build has to come from its commit.
          if tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha 2>/dev/null) && [[ $tagged != "$GITHUB_SHA" ]]; then
            echo "::error::$tag already tags $tagged: run this on that commit, or bump version in mobile/app.config.ts"
            exit 1
          fi
          # This job's token cannot see drafts; the draft job takes an earlier run's draft, and a
          # prerelease (a beta branch's build) may be rebuilt.
          state=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq 'if .isDraft then "draft" elif .isPrerelease then "prerelease" else "published" end' 2>/dev/null || true)
          if [[ $state == published ]]; then
            echo "::error::$tag is already published: bump version in mobile/app.config.ts"
            exit 1
          fi
          bun -e '
            import { extractReleaseNotes } from "./scripts/changelog.ts"
            if (!extractReleaseNotes(await Bun.file("CHANGELOG.md").text(), process.argv[1])) {
              console.error(`::error::CHANGELOG.md has no "## [${process.argv[1]}]" section`)
              process.exit(1)
            }
          ' "$version"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "ios=$ios"
            echo "android=$android"
          } >> "$GITHUB_OUTPUT"

  # The builds upload into one draft, which this job makes first; each would make its own.
  draft:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Draft ${{ needs.version.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if ! state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq 'if .isDraft then "draft" elif .isPrerelease then "prerelease" else "published" end' 2>/dev/null); then
            state=none
          fi
          case $state in
            published)
              echo "::error::$TAG was published while this ran, so it stays as it is"
              exit 1
              ;;
            prerelease)
              # A beta branch may rebuild its prerelease; the uploads replace its assets below.
              ;;
            draft)
              # An earlier run's draft takes these builds, from this commit, and keeps its notes.
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
              ;;
            none)
              bun -e '
                import { extractReleaseNotes } from "./scripts/changelog.ts"
                await Bun.write("notes.md", extractReleaseNotes(await Bun.file("CHANGELOG.md").text(), process.env.VERSION) + "\n")
              '
              # Not the latest release, which stays the CLI's that install-cli.sh downloads. A
              # prerelease keeps stable phones from updating to it; a beta branch installs it
              # from its release page.
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --prerelease --latest=false --target "$GITHUB_SHA" --title "Lorca for iPhone and Android $VERSION" --notes-file notes.md
              ;;
          esac

  ios:
    name: iOS to GitHub
    needs: [version, draft]
    if: needs.version.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Read the Rust version
        id: rust
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      # The target directory and the crate registry, kept across releases. The key does not
      # change with Cargo.lock: a release's version bump rewrites it, but the dependencies do not.
      - uses: actions/cache@v6
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: rust-${{ runner.os }}-${{ steps.rust.outputs.version }}-mobile-ios
          restore-keys: rust-${{ runner.os }}-${{ steps.rust.outputs.version }}-mobile-
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: mobile
      # What `bun run release-ios` takes from the last release on a Mac that keeps it: Xcode's
      # compilation cache, which answers React Native's C, C++, and Objective-C compiles, and the
      # installed pods. A cache is never overwritten, so each run saves its own and restores the newest.
      - uses: actions/cache@v6
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
            dist/ios/mobile/ios/Pods
            dist/ios/mobile/ios/Podfile.lock
          key: ios-native-${{ github.run_id }}
          restore-keys: ios-native-
      - name: Build
        run: bun run release-ios
      - name: Upload to ${{ needs.version.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release upload "$TAG" "dist/ios/lorca-$VERSION-ios.ipa" --repo "$GITHUB_REPOSITORY" --clobber

  android:
    name: Android to GitHub
    needs: [version, draft]
    if: needs.version.outputs.android == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Read the Rust version
        id: rust
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      # The target directory and the crate registry, kept across releases. The key does not
      # change with Cargo.lock: a release's version bump rewrites it, but the dependencies do not.
      - uses: actions/cache@v6
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: rust-${{ runner.os }}-${{ steps.rust.outputs.version }}-mobile-android
          restore-keys: rust-${{ runner.os }}-${{ steps.rust.outputs.version }}-mobile-
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # Gradle's caches between runs; the project itself is generated by each build.
      - uses: gradle/actions/setup-gradle@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: mobile
      - name: Build
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z $KEYSTORE || -z $ANDROID_KEYSTORE_PASSWORD ]]; then
            echo "::error::the ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD secrets are missing: docs/releasing-mobile.md"
            exit 1
          fi
          umask 077
          export ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore
          base64 --decode <<<"$KEYSTORE" > "$ANDROID_KEYSTORE"
          trap 'rm -f "$ANDROID_KEYSTORE"' EXIT
          bun run release-android
      - name: Upload to ${{ needs.version.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release upload "$TAG" "dist/android/lorca-$VERSION-android.apk" --repo "$GITHUB_REPOSITORY" --clobber

  # The draft is published only after both platforms the run asked for have uploaded. The tag
  # appears here, and the phone's update window reads it; it does not become the latest release,
  # which stays the CLI's.
  publish:
    needs: [version, draft, ios, android]
    if: |
      always() &&
      needs.version.result == 'success' &&
      needs.draft.result == 'success' &&
      (needs.ios.result == 'success' || needs.ios.result == 'skipped') &&
      (needs.android.result == 'success' || needs.android.result == 'skipped') &&
      (needs.ios.result == 'success' || needs.android.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish ${{ needs.version.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false --prerelease
