# Lorca in containers: the relay, and a CLI Runner with no desktop app on the same computer.
#
#   LORCA_RELAY_SECRET=$(openssl rand -hex 32) docker compose up -d
#   docker compose logs -f runner
#
# The relay's token-signing secret is not in this file. Set it in the shell, as above, or in a
# .env beside this file; compose refuses to start without it.
#
# Nothing here has to be done with `docker` by hand: the Runner's entry point pairs or creates
# its identity on the first start, then runs the server. To join an existing account, set
# LORCA_PAIR_STRING below to the string a paired Device shows.
#
# Ports are picked away from the defaults (relay 8787, CLI 4862) so a locally running relay or
# a desktop app's CLI on this computer never collides with these.
#
# Only the relay is published. The runner's local websocket binds 127.0.0.1 inside its container
# and accepts only a loopback Host, which a published port does not carry, so it stays reachable
# from that container alone; the relay is how a bot on it is driven from another Device.

services:
  relay:
    image: ghcr.io/${LORCA_IMAGE_OWNER:-hcl-z}/lorca-relay:${LORCA_IMAGE_TAG:-1.0.23}
    environment:
      # Signs bearer tokens. Fixed, so a restart does not log every Device out. Compose reads it
      # from the shell or a .env beside this file and refuses to start without it: a secret in
      # the repository would let anyone who reads it impersonate a Device. Make one with
      # `openssl rand -hex 32`.
      LORCA_RELAY_SECRET: ${LORCA_RELAY_SECRET:?set LORCA_RELAY_SECRET to the output of openssl rand -hex 32}
      # The image's default is [::]:${PORT:-8787}; this names the port the published mapping uses.
      LORCA_RELAY_BIND: "[::]:18787"
    ports:
      # Loopback only. A phone or another computer needs an HTTPS name in front of it.
      - "127.0.0.1:18787:18787"
    volumes:
      # The image runs in /data: lorca-relay.db and lorca-relay.files live here.
      - relay-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:18787/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  runner:
    image: ghcr.io/${LORCA_IMAGE_OWNER:-hcl-z}/lorca-cli:${LORCA_IMAGE_TAG:-1.0.23}
    environment:
      # The data directory: keys, credentials, chats, workspaces, and the local websocket token.
      LORCA_HOME: /data
      # No app on this computer to learn the relay from, so name it.
      LORCA_RELAY_URL: http://relay:18787
      # Away from the CLI's default, so a desktop app's own CLI on this computer cannot collide.
      LORCA_PORT: "14862"
      RUST_LOG: lorca=info
      # The name this Device shows on every other one.
      LORCA_DEVICE_NAME: nas
      # A pairing string from a Device already in the account. Empty, the first start creates a
      # new identity on this Device instead, and writes its backup phrase to /data/backup-phrase.txt.
      LORCA_PAIR_STRING: ""
    volumes:
      - runner-data:/data
    depends_on:
      relay:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # `lorca serve` answers "lorca" on / for this data directory's loopback.
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:14862/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  relay-data:
  runner-data:
